name: APK analysis and rebuild

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Apply a reviewed patch and build a test APK
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: apple-music-vivo-car-lyrics
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APK_NAME: apple-music-7-0-0-beta-1611.apk
      APKTOOL_VERSION: '2.11.1'
      JADX_VERSION: '1.5.1'
      BUILD_TOOLS_VERSION: '35.0.0'
      APKTOOL_SHA256: '56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db'
      JADX_SHA256: '12fd966431903b8e15c36e5007f19343475be7d8f2a55f082e7a929eeabc937e'
      # Android 16+ packages expose ZIP layouts not handled by the V1.4.9 release. Pin
      # the upstream snapshot that includes the newer ARSCLib support until a release is cut.
      APKEDITOR_COMMIT: '5621fe6750b828ce0bfd99ec7f42ee8b5fe75497'

    steps:
      - uses: actions/checkout@v4

      - name: Recreate private payload archive
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f payload.sha256
          mkdir -p payload
          cat payload.tar.part.* > "$RUNNER_TEMP/payload.tar"
          expected="$(awk 'NR == 1 {print tolower($1)}' payload.sha256)"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/payload.tar" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/payload.tar" -C payload
          find payload -name '._*' -delete || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Test lyrics and standalone title contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash cloud-patch/tests/run-java-tests.sh
          python3 cloud-patch/tests/verify_source_contract.py
          python3 -m unittest discover -s cloud-patch/tests -p 'test_*.py' -v

      - name: Install Android build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [[ -n "$sdk_root" ]] || { echo "Android SDK path is unavailable" >&2; exit 1; }
          sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -perm -111 -print | sort -V | tail -n 1)"
          [[ -x "$sdkmanager_bin" ]] || { echo "sdkmanager was not found under $sdk_root" >&2; exit 1; }
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "build-tools;${BUILD_TOOLS_VERSION}" "platforms;android-30" "platforms;android-35"
          echo "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}" >> "$GITHUB_PATH"

      - name: Checkout pinned APKEditor snapshot
        uses: actions/checkout@v4
        with:
          repository: REAndroid/APKEditor
          ref: ${{ env.APKEDITOR_COMMIT }}
          path: apkeditor-snapshot

      - name: Setup Java 11 for APKEditor snapshot build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Build pinned APKEditor snapshot
        working-directory: apkeditor-snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          chmod +x ./gradlew
          ./gradlew --no-daemon fatJar
          jar_file="$(find build/libs -maxdepth 1 -type f -name 'APKEditor-*.jar' ! -name '*-sources.jar' | head -n 1)"
          [[ -n "$jar_file" ]] || { echo "APKEditor fat jar was not built" >&2; exit 1; }
          cp "$jar_file" "$RUNNER_TEMP/tools/APKEditor-snapshot.jar"
          sha256sum "$RUNNER_TEMP/tools/APKEditor-snapshot.jar"

      - name: Restore Java 17 for pipeline
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install analysis tools
        shell: bash
        run: |
          set -Eeuo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools" payload/out/report

          curl --fail --location --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" \
            -o "$tools/apktool.jar"
          curl --fail --location --retry 3 \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip" \
            -o "$tools/jadx.zip"


          apktool_actual="$(sha256sum "$tools/apktool.jar" | awk '{print $1}')"
          jadx_actual="$(sha256sum "$tools/jadx.zip" | awk '{print $1}')"
          apkeditor_actual="$(sha256sum "$tools/APKEditor-snapshot.jar" | awk '{print $1}')"
          printf 'apktool_%s.jar  %s\njadx-%s.zip  %s\nAPKEditor-snapshot-%s.jar  %s\n' \
            "$APKTOOL_VERSION" "$apktool_actual" \
            "$JADX_VERSION" "$jadx_actual" \
            "${APKEDITOR_COMMIT:0:12}" "$apkeditor_actual" \
            | tee payload/out/report/tool-sha256.txt

          if [[ -n "${APKTOOL_SHA256:-}" ]]; then
            [[ "${APKTOOL_SHA256,,}" == "$apktool_actual" ]] || {
              echo "apktool SHA-256 mismatch" >&2
              exit 1
            }
          fi
          if [[ -n "${JADX_SHA256:-}" ]]; then
            [[ "${JADX_SHA256,,}" == "$jadx_actual" ]] || {
              echo "jadx SHA-256 mismatch" >&2
              exit 1
            }
          fi

          unzip -q "$tools/jadx.zip" -d "$tools/jadx"
          chmod +x "$tools/jadx/bin/jadx"
          echo "APKTOOL_JAR=$tools/apktool.jar" >> "$GITHUB_ENV"
          echo "JADX_BIN=$tools/jadx/bin/jadx" >> "$GITHUB_ENV"
          echo "APKEDITOR_JAR=$tools/APKEditor-snapshot.jar" >> "$GITHUB_ENV"

      - name: Reconstruct and verify original APK
        shell: bash
        run: |
          set -Eeuo pipefail
          find input/splits -name '._*' -delete 2>/dev/null || true
          scripts/ci/reconstruct.sh "$APK_NAME"
        working-directory: payload

      - name: Decode and locate MediaSession/lyrics paths
        run: scripts/ci/analyze.sh
        working-directory: payload

      - name: Prepare focused patching report
        shell: bash
        working-directory: payload
        run: |
          set -Eeuo pipefail
          report=out/report
          focused=out/focused
          mkdir -p "$focused/files"

          pattern='MediaPlaybackService|MediaSession|MediaMetadata|setMetadata|setExtras|HAS_LYRICS|lyrics|Lyrics|TimedText|Ttml'
          roots=(
            work/jadx/sources/com/apple/android/music
            work/apktool/smali/com/apple/android/music
            work/apktool/smali_classes2/com/apple/android/music
            work/apktool/smali_classes3/com/apple/android/music
            work/apktool/smali_classes4/com/apple/android/music
          )

          existing_roots=()
          for root in "${roots[@]}"; do
            [[ -d "$root" ]] && existing_roots+=("$root")
          done

          : > "$report/focused-paths.txt"
          if ((${#existing_roots[@]} > 0)); then
            grep -RIlE "$pattern" "${existing_roots[@]}" \
              | LC_ALL=C sort -u \
              | head -n 600 \
              > "$report/focused-paths.txt" || true

            grep -RInE -C 16 "$pattern" "${existing_roots[@]}" \
              > "$report/focused-context.txt" || true
          fi

          # Media3's legacy MediaSession bridge lives outside com/apple/android/music, in
          # obfuscated top-level packages, so the roots above never captured it. Atomic Player
          # reads the top-level legacy METADATA_KEY_DURATION that this bridge produces, so its
          # source is required to see where that value actually comes from. Narrow pattern on
          # purpose: the whole smali tree is far too large to collect wholesale.
          legacy_pattern='android\.media\.metadata\.DURATION|METADATA_KEY_DURATION|MediaMetadataCompat'
          legacy_roots=()
          for root in work/apktool/smali work/apktool/smali_classes2 \
                      work/apktool/smali_classes3 work/apktool/smali_classes4; do
            [[ -d "$root" ]] && legacy_roots+=("$root")
          done

          : > "$report/legacy-bridge-paths.txt"
          if ((${#legacy_roots[@]} > 0)); then
            grep -RIlE "$legacy_pattern" "${legacy_roots[@]}" \
              | grep -vE '/com/apple/android/music/' \
              | LC_ALL=C sort -u \
              | head -n 120 \
              > "$report/legacy-bridge-paths.txt" || true

            # Must stay guarded: with an empty path list grep would get no file arguments and
            # block reading stdin, hanging the job.
            if [[ -s "$report/legacy-bridge-paths.txt" ]]; then
              head -n 40 "$report/legacy-bridge-paths.txt" \
                | tr '\n' '\0' \
                | xargs -0 --no-run-if-empty \
                    grep -InE -C 24 "$legacy_pattern" \
                  > "$report/legacy-bridge-context.txt" 2>/dev/null || true
            fi
          fi
          cat "$report/legacy-bridge-paths.txt" >> "$report/focused-paths.txt"

          # Second pass: Media3's session classes themselves. The first pass keys on DURATION and
          # MediaMetadataCompat, which the session class does not mention, so MediaLibrarySession
          # (the obfuscated holder of the compat token) was never collected. Without its field and
          # method tables the token has to be guessed by reflection, which is what kept failing.
          # Key on the session-token surface instead.
          session_pattern='MediaSessionCompat\$Token|getSessionCompat|MediaSessionService|onGetSession'
          : > "$report/session-class-paths.txt"
          if ((${#legacy_roots[@]} > 0)); then
            grep -RIlE "$session_pattern" "${legacy_roots[@]}" \
              | grep -vE '/com/apple/android/music/|/android/support/v4/' \
              | LC_ALL=C sort -u \
              | head -n 80 \
              > "$report/session-class-paths.txt" || true

            if [[ -s "$report/session-class-paths.txt" ]]; then
              head -n 30 "$report/session-class-paths.txt" \
                | tr '\n' '\0' \
                | xargs -0 --no-run-if-empty \
                    grep -InE -C 12 "$session_pattern" \
                  > "$report/session-class-context.txt" 2>/dev/null || true
            fi
          fi
          cat "$report/session-class-paths.txt" >> "$report/focused-paths.txt"

          # Keep complete title/catalog seams, independent of the capped lyrics report.
          title_roots=(
            work/jadx/sources/com/apple/android/music/player
            work/jadx/sources/com/apple/android/music/databinding
            work/jadx/sources/com/apple/android/music/mediaapi
            work/apktool/smali_classes2/com/apple/android/music/player
            work/apktool/smali_classes2/com/apple/android/music/databinding
            work/apktool/smali_classes2/com/apple/android/music/mediaapi
          )
          : > "$report/title-correction-paths.txt"
          for root in "${title_roots[@]}"; do
            if [[ -d "$root" ]]; then
              grep -RIlE 'getTitle|getName|MediaApiRepositoryHolder|MediaApiResponse|MediaEntity|Notification' \
                "$root" >> "$report/title-correction-paths.txt" || true
            fi
          done
          for root in work/apktool/smali*; do
            for relative in w9/Q.smali w9/a.smali z3/y.smali z3/w.smali; do
              [[ ! -f "$root/$relative" ]] || printf '%s\n' "$root/$relative" \
                >> "$report/title-correction-paths.txt"
            done
          done
          for root in work/jadx/sources/w9 work/jadx/sources/z3; do
            if [[ -d "$root" ]]; then
              find "$root" -type f >> "$report/title-correction-paths.txt"
            fi
          done
          cat "$report/title-correction-paths.txt" >> "$report/focused-paths.txt"

          # The title binder and notification paths are outside the normal focused roots.
          ui_roots=(
            work/jadx/sources/q8
            work/jadx/sources/z3
            work/jadx/sources/J4
            work/apktool/smali/q8
            work/apktool/smali_classes2/q8
            work/apktool/smali_classes3/q8
            work/apktool/smali_classes4/q8
          )
          : > "$report/title-ui-notification-paths.txt"
          for root in "${ui_roots[@]}"; do
            [[ -d "$root" ]] || continue
            grep -RIlE 'executeBindings|TextViewBindingAdapter|setText|setContentTitle|NotificationCompat|NotificationManager' \
              "$root" >> "$report/title-ui-notification-paths.txt" || true
          done
          cat "$report/title-ui-notification-paths.txt" >> "$report/focused-paths.txt"

          # Export full generated binders and coroutine/notification implementations:
          # obfuscated calls often no longer contain the searchable source method name.
          for root in work/apktool/smali*; do
            for package in q8 J4 w9 x9 y9 kk fi gi bi kotlin/coroutines \
              com/apple/android/music/player; do
              [[ ! -d "$root/$package" ]] || find "$root/$package" -type f \
                >> "$report/focused-paths.txt"
            done
            for relative in \
              com/apple/android/music/model/BaseContentItem.smali \
              com/apple/android/music/model/BaseCollectionItemView.smali \
              com/apple/android/music/model/BasePlaybackItem.smali \
              com/apple/android/music/model/CollectionItemView.smali \
              com/apple/android/music/model/PlaybackItem.smali \
              com/apple/android/music/model/Song.smali \
              com/apple/android/music/mediaapi/models/Song.smali \
              com/apple/android/music/collection/mediaapi/controller/PlaylistPageController.smali \
              com/apple/android/music/collection/mediaapi/controller/AlbumPageController.smali \
              com/apple/android/music/playback/model/PlayerQueueItem.smali \
              com/apple/android/music/playback/model/PlayerMediaItem.smali; do
              [[ ! -f "$root/$relative" ]] || printf '%s\n' "$root/$relative" \
                >> "$report/focused-paths.txt"
            done
          done

          LC_ALL=C sort -u "$report/focused-paths.txt" -o "$report/focused-paths.txt"

          while IFS= read -r source; do
            [[ -f "$source" ]] || continue
            mkdir -p "$focused/files/$(dirname "$source")"
            cp "$source" "$focused/files/$source"
          done < "$report/focused-paths.txt"

          # 6.5.3 renamed Media3's ControllerInfo from B2$e to t2$e. New versions can
          # rename it again, so derive candidates from Apple callback methods whose
          # second argument ends in the Media3 inner-class suffix $e, then copy each
          # complete class for field-layout analysis.
          : > "$report/controller-info-candidates.txt"
          grep -RhoE '^\.method public final [^ (]+\(L[^ (;]+;L[^ (;]*\$e;' \
            work/apktool/smali*/com/apple/android/music/player 2>/dev/null \
            | sed -E 's/.*(L[^ (;]+\$e;).*/\1/' \
            | LC_ALL=C sort -u \
            | while IFS= read -r descriptor; do
                [[ -n "$descriptor" ]] || continue
                relative_path="${descriptor#L}"
                relative_path="${relative_path%;}"
                candidate=""
                for smali_root in work/apktool/smali work/apktool/smali_classes2 \
                                   work/apktool/smali_classes3 work/apktool/smali_classes4; do
                  possible="$smali_root/$relative_path.smali"
                  if [[ -f "$possible" ]]; then
                    candidate="$possible"
                    break
                  fi
                done
                if [[ -n "$candidate" ]]; then
                  printf '%s\n' "$candidate" >> "$report/controller-info-candidates.txt"
                  mkdir -p "$focused/files/$(dirname "$candidate")"
                  cp "$candidate" "$focused/files/$candidate"
                fi
              done

          cp "$report"/*.txt "$focused/" 2>/dev/null || true
          cp "$report"/*.log "$focused/" 2>/dev/null || true
          tar -C "$focused" -czf "$report/focused-sources.tar.gz" files
          rm -rf "$focused/files"
          rm -f "$report/decode-sources.tar.gz"

          find "$report" -maxdepth 1 -type f -printf '%f\t%s bytes\n' \
            | LC_ALL=C sort > "$report/report-files.txt"

      - name: Upload analysis report
        if: ${{ !inputs.rebuild }}
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-analysis
          path: |
            payload/out/report
            payload/out/focused
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Apply reviewed patches
        if: ${{ inputs.rebuild }}
        run: bash ../cloud-patch/apply.sh
        working-directory: payload

      - name: Rebuild, align and fixed-sign
        if: ${{ inputs.rebuild }}
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: bash ../cloud-patch/rebuild.sh
        working-directory: payload

      - name: Create GitHub Release
        if: ${{ inputs.rebuild && success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          tag_name="v1.0.0-build-${{ github.run_number }}"
          gh release create "$tag_name" \
            payload/out/apple-music-vivo-car-lyrics-debug.apk \
            payload/out/apple-music-vivo-car-lyrics-debug.apk.sha256 \
            --title "Apple Music Vivo Car Lyrics - Build #${{ github.run_number }}" \
            --notes "Patched APK with fixed signature, cluster lyrics, timestamped long-line pagination, and standalone catalog title correction for the player and notification. No AM++ or NPatch required. Title correction does not republish MediaItem or MediaMetadata. Device and car regression testing is still required."

      - name: Upload verified APK
        if: ${{ inputs.rebuild && success() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-vivo-car-lyrics-debug
          path: |
            payload/out/apple-music-vivo-car-lyrics-debug.apk
            payload/out/apple-music-vivo-car-lyrics-debug.apk.sha256
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload analysis reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: apk-results-${{ github.run_number }}-report
          path: |
            payload/out/report/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0
