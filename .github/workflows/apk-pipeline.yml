name: APK analysis and rebuild

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Apply a reviewed patch and build a test APK
        required: true
        default: true
        type: boolean
      embed_ampp:
        description: Also wrap the rebuilt APK in an NPatch shell with the AM++ module embedded
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: apple-music-vivo-car-lyrics
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APK_NAME: apple-music-6-5-2.apk
      APKTOOL_VERSION: '2.11.1'
      JADX_VERSION: '1.5.1'
      BUILD_TOOLS_VERSION: '35.0.0'
      APKTOOL_SHA256: '56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db'
      JADX_SHA256: '12fd966431903b8e15c36e5007f19343475be7d8f2a55f082e7a929eeabc937e'
      # Pinned by content hash, not by tag: both artifacts are third-party release assets and a
      # re-upload under an unchanged tag would otherwise silently change the opt-in build.
      # Use the author's framework family; this pin is not the same framework build as
      # the author's 902 embed. Runtime feature compatibility still needs device testing.
      NPATCH_URL: 'https://github.com/7723mod/NPatch/releases/download/v1.0.7/jar-v1.0.7-741-release.jar'
      NPATCH_SHA256: '855c6499ac871663ae6c02dcb3a32cbbdfa88d67a312094249cc54e7f3ec8252'
      AMPP_URL: 'https://github.com/Zennmn/AM-plus-plus/releases/download/v1.5.5/AM-plus-plus-v1.5.5.apk'
      AMPP_SHA256: '2cc83a041eb0ffb382c8dbe07736d50fee4544961cf517b3f911d103aa279c92'

    steps:
      - uses: actions/checkout@v4

      - name: Recreate private payload archive
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f payload.sha256
          mkdir -p payload
          cat payload.tar.part.* > "$RUNNER_TEMP/payload.tar"
          expected="$(awk 'NR == 1 {print tolower($1)}' payload.sha256)"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/payload.tar" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/payload.tar" -C payload

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Test cluster lyric pagination and publishing contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test_classes="$RUNNER_TEMP/cluster-lyrics-tests"
          rm -rf "$test_classes"
          mkdir -p "$test_classes"
          javac --release 8 -d "$test_classes" \
            cloud-patch/java/com/apple/android/music/player/ClusterLyricsPaginator.java \
            cloud-patch/tests/com/apple/android/music/player/ClusterLyricsPaginatorTest.java
          java -cp "$test_classes" com.apple.android.music.player.ClusterLyricsPaginatorTest
          python3 cloud-patch/tests/verify_source_contract.py
          python3 -m unittest discover -s cloud-patch/tests -p 'test_embed_build.py'

      - name: Install Android build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [[ -n "$sdk_root" ]] || { echo "Android SDK path is unavailable" >&2; exit 1; }
          sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -perm -111 -print | sort -V | tail -n 1)"
          [[ -x "$sdkmanager_bin" ]] || { echo "sdkmanager was not found under $sdk_root" >&2; exit 1; }
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "build-tools;${BUILD_TOOLS_VERSION}" "platforms;android-30" "platforms;android-35"
          echo "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}" >> "$GITHUB_PATH"

      - name: Install analysis tools
        shell: bash
        run: |
          set -Eeuo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools" payload/out/report

          curl --fail --location --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" \
            -o "$tools/apktool.jar"
          curl --fail --location --retry 3 \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip" \
            -o "$tools/jadx.zip"

          apktool_actual="$(sha256sum "$tools/apktool.jar" | awk '{print $1}')"
          jadx_actual="$(sha256sum "$tools/jadx.zip" | awk '{print $1}')"
          printf 'apktool_%s.jar  %s\njadx-%s.zip  %s\n' \
            "$APKTOOL_VERSION" "$apktool_actual" \
            "$JADX_VERSION" "$jadx_actual" \
            | tee payload/out/report/tool-sha256.txt

          if [[ -n "${APKTOOL_SHA256:-}" ]]; then
            [[ "${APKTOOL_SHA256,,}" == "$apktool_actual" ]] || {
              echo "apktool SHA-256 mismatch" >&2
              exit 1
            }
          fi
          if [[ -n "${JADX_SHA256:-}" ]]; then
            [[ "${JADX_SHA256,,}" == "$jadx_actual" ]] || {
              echo "jadx SHA-256 mismatch" >&2
              exit 1
            }
          fi

          unzip -q "$tools/jadx.zip" -d "$tools/jadx"
          chmod +x "$tools/jadx/bin/jadx"
          echo "APKTOOL_JAR=$tools/apktool.jar" >> "$GITHUB_ENV"
          echo "JADX_BIN=$tools/jadx/bin/jadx" >> "$GITHUB_ENV"

      - name: Reconstruct and verify original APK
        run: scripts/ci/reconstruct.sh "$APK_NAME"
        working-directory: payload

      - name: Decode and locate MediaSession/lyrics paths
        run: scripts/ci/analyze.sh
        working-directory: payload

      - name: Prepare focused patching report
        shell: bash
        working-directory: payload
        run: |
          set -Eeuo pipefail
          report=out/report
          focused=out/focused
          mkdir -p "$focused/files"

          pattern='MediaPlaybackService|MediaSession|MediaMetadata|setMetadata|setExtras|HAS_LYRICS|lyrics|Lyrics|TimedText|Ttml'
          roots=(
            work/jadx/sources/com/apple/android/music
            work/apktool/smali/com/apple/android/music
            work/apktool/smali_classes2/com/apple/android/music
            work/apktool/smali_classes3/com/apple/android/music
            work/apktool/smali_classes4/com/apple/android/music
          )

          existing_roots=()
          for root in "${roots[@]}"; do
            [[ -d "$root" ]] && existing_roots+=("$root")
          done

          : > "$report/focused-paths.txt"
          if ((${#existing_roots[@]} > 0)); then
            grep -RIlE "$pattern" "${existing_roots[@]}" \
              | LC_ALL=C sort -u \
              | head -n 600 \
              > "$report/focused-paths.txt" || true

            grep -RInE -C 16 "$pattern" "${existing_roots[@]}" \
              > "$report/focused-context.txt" || true
          fi

          # Media3's legacy MediaSession bridge lives outside com/apple/android/music, in
          # obfuscated top-level packages, so the roots above never captured it. Atomic Player
          # reads the top-level legacy METADATA_KEY_DURATION that this bridge produces, so its
          # source is required to see where that value actually comes from. Narrow pattern on
          # purpose: the whole smali tree is far too large to collect wholesale.
          legacy_pattern='android\.media\.metadata\.DURATION|METADATA_KEY_DURATION|MediaMetadataCompat'
          legacy_roots=()
          for root in work/apktool/smali work/apktool/smali_classes2 \
                      work/apktool/smali_classes3 work/apktool/smali_classes4; do
            [[ -d "$root" ]] && legacy_roots+=("$root")
          done

          : > "$report/legacy-bridge-paths.txt"
          if ((${#legacy_roots[@]} > 0)); then
            grep -RIlE "$legacy_pattern" "${legacy_roots[@]}" \
              | grep -vE '/com/apple/android/music/' \
              | LC_ALL=C sort -u \
              | head -n 120 \
              > "$report/legacy-bridge-paths.txt" || true

            # Must stay guarded: with an empty path list grep would get no file arguments and
            # block reading stdin, hanging the job.
            if [[ -s "$report/legacy-bridge-paths.txt" ]]; then
              head -n 40 "$report/legacy-bridge-paths.txt" \
                | tr '\n' '\0' \
                | xargs -0 --no-run-if-empty \
                    grep -InE -C 24 "$legacy_pattern" \
                  > "$report/legacy-bridge-context.txt" 2>/dev/null || true
            fi
          fi
          cat "$report/legacy-bridge-paths.txt" >> "$report/focused-paths.txt"

          # Second pass: Media3's session classes themselves. The first pass keys on DURATION and
          # MediaMetadataCompat, which the session class does not mention, so MediaLibrarySession
          # (the obfuscated holder of the compat token) was never collected. Without its field and
          # method tables the token has to be guessed by reflection, which is what kept failing.
          # Key on the session-token surface instead.
          session_pattern='MediaSessionCompat\$Token|getSessionCompat|MediaSessionService|onGetSession'
          : > "$report/session-class-paths.txt"
          if ((${#legacy_roots[@]} > 0)); then
            grep -RIlE "$session_pattern" "${legacy_roots[@]}" \
              | grep -vE '/com/apple/android/music/|/android/support/v4/' \
              | LC_ALL=C sort -u \
              | head -n 80 \
              > "$report/session-class-paths.txt" || true

            if [[ -s "$report/session-class-paths.txt" ]]; then
              head -n 30 "$report/session-class-paths.txt" \
                | tr '\n' '\0' \
                | xargs -0 --no-run-if-empty \
                    grep -InE -C 12 "$session_pattern" \
                  > "$report/session-class-context.txt" 2>/dev/null || true
            fi
          fi
          cat "$report/session-class-paths.txt" >> "$report/focused-paths.txt"

          LC_ALL=C sort -u "$report/focused-paths.txt" -o "$report/focused-paths.txt"

          while IFS= read -r source; do
            [[ -f "$source" ]] || continue
            mkdir -p "$focused/files/$(dirname "$source")"
            cp "$source" "$focused/files/$source"
          done < "$report/focused-paths.txt"

          cp "$report"/*.txt "$focused/" 2>/dev/null || true
          cp "$report"/*.log "$focused/" 2>/dev/null || true
          tar -C "$focused" -czf "$report/focused-sources.tar.gz" files
          rm -rf "$focused/files"
          rm -f "$report/decode-sources.tar.gz"

          find "$report" -maxdepth 1 -type f -printf '%f\t%s bytes\n' \
            | LC_ALL=C sort > "$report/report-files.txt"

      - name: Apply reviewed patches
        if: ${{ inputs.rebuild }}
        run: bash ../cloud-patch/apply.sh
        working-directory: payload

      - name: Rebuild, align and fixed-sign
        if: ${{ inputs.rebuild }}
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: bash ../cloud-patch/rebuild.sh
        working-directory: payload

      # NPatch's jar targets class file version 65, so it needs a Java 21 runtime; the pipeline's
      # own 17 is left as the default for everything else. Installing it here rather than at job
      # level keeps the main path unchanged when embed_ampp is off.
      - name: Set up Java 21 for NPatch
        if: ${{ inputs.rebuild && inputs.embed_ampp }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # continue-on-error, and gated on nothing but the input: the embedded build is a side
      # experiment on top of the real one, and it must never be able to cost the main APK its
      # Release or its artifact.
      - name: Embed AM++ module with NPatch
        id: embed_ampp
        if: ${{ inputs.rebuild && inputs.embed_ampp }}
        continue-on-error: true
        shell: bash
        working-directory: payload
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -Eeuo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"

          curl --fail --location --retry 3 "$NPATCH_URL" -o "$tools/npatch.jar"
          curl --fail --location --retry 3 "$AMPP_URL" -o "$tools/AM-plus-plus-v1.5.5.apk"

          npatch_actual="$(sha256sum "$tools/npatch.jar" | awk '{print $1}')"
          ampp_actual="$(sha256sum "$tools/AM-plus-plus-v1.5.5.apk" | awk '{print $1}')"
          [[ "${NPATCH_SHA256,,}" == "$npatch_actual" ]] || {
            echo "npatch.jar SHA-256 mismatch" >&2
            exit 1
          }
          [[ "${AMPP_SHA256,,}" == "$ampp_actual" ]] || {
            echo "AM++ module SHA-256 mismatch" >&2
            exit 1
          }

          NPATCH_JAR="$tools/npatch.jar" \
          AMPP_MODULE_APK="$tools/AM-plus-plus-v1.5.5.apk" \
            bash ../cloud-patch/embed-ampp.sh

      # continue-on-error above keeps a broken wrapper from costing the main build its Release,
      # but it also paints the step green in the step list. Say plainly which way it went, in the
      # job summary, so a failed embed cannot be read as a successful one.
      - name: Report AM++ embedding outcome
        if: ${{ inputs.rebuild && inputs.embed_ampp }}
        shell: bash
        env:
          EMBED_OUTCOME: ${{ steps.embed_ampp.outcome }}
        run: |
          set -Eeuo pipefail
          embedded=payload/out/embed-ampp/apple-music-vivo-car-lyrics-ampp-npatched.apk
          if [[ "$EMBED_OUTCOME" == success && -f "$embedded" && -f "$embedded.sha256" ]]; then
              printf '### AM++ embedded APK built (NPatch)\n\n`%s`\n\n```\n%s\n```\n\nPackaging success is not runtime verification. Check `adb logcat` for module health and catalog query errors; the NPatch file log may contain only bootstrap messages. `title_correction: ACTIVE` alone does not prove that song titles are corrected.\n' \
              "$(basename "$embedded")" "$(cat "$embedded.sha256")" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### AM++ embedding FAILED\n\nThe main APK and its Release are unaffected. See the "Embed AM++ module with NPatch" step log.\n' \
              >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::AM++ embedding did not produce an APK; the main build is unaffected"
          fi

      - name: Create GitHub Release
        if: ${{ inputs.rebuild && success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          tag_name="v1.0.0-build-${{ github.run_number }}"
          gh release create "$tag_name" \
            payload/out/apple-music-vivo-car-lyrics-debug.apk \
            payload/out/apple-music-vivo-car-lyrics-debug.apk.sha256 \
            --title "Apple Music Vivo Car Lyrics - Build #${{ github.run_number }}" \
            --notes "Patched APK with fixed signature, correct cluster MediaMetadata lyrics, and timestamped long-line pagination. Album artwork flashing may still depend on CarNetworking behavior."

      - name: Upload verified APK
        if: ${{ inputs.rebuild && success() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-vivo-car-lyrics-debug
          path: |
            payload/out/apple-music-vivo-car-lyrics-debug.apk
            payload/out/apple-music-vivo-car-lyrics-debug.apk.sha256
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      # Deliberately a separate artifact, and deliberately not attached to the main Release: it is
      # the same r38 build inside a different shell, and the two must never be confused when
      # flashing or comparing in the car.
      - name: Upload AM++-embedded APK
        if: ${{ inputs.rebuild && inputs.embed_ampp && steps.embed_ampp.outcome == 'success' && hashFiles('payload/out/embed-ampp/apple-music-vivo-car-lyrics-ampp-npatched.apk') != '' && hashFiles('payload/out/embed-ampp/apple-music-vivo-car-lyrics-ampp-npatched.apk.sha256') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-vivo-car-lyrics-ampp-npatched
          path: |
            payload/out/embed-ampp/apple-music-vivo-car-lyrics-ampp-npatched.apk
            payload/out/embed-ampp/apple-music-vivo-car-lyrics-ampp-npatched.apk.sha256
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload analysis reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: apk-results-${{ github.run_number }}-report
          path: |
            payload/out/report/
            payload/out/embed-ampp/report/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0
