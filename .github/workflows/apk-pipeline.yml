name: APK analysis and rebuild

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Apply a reviewed patch and build a test APK
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: apple-music-vivo-car-lyrics
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APK_NAME: apple-music-6-5-2.apk
      APKTOOL_VERSION: '2.11.1'
      JADX_VERSION: '1.5.1'
      BUILD_TOOLS_VERSION: '35.0.0'
      APKTOOL_SHA256: '56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db'
      JADX_SHA256: '12fd966431903b8e15c36e5007f19343475be7d8f2a55f082e7a929eeabc937e'

    steps:
      - uses: actions/checkout@v4

      - name: Recreate private payload archive
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f payload.sha256
          mkdir -p payload
          cat payload.tar.part.* > "$RUNNER_TEMP/payload.tar"
          expected="$(awk 'NR == 1 {print tolower($1)}' payload.sha256)"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/payload.tar" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/payload.tar" -C payload

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [[ -n "$sdk_root" ]] || { echo "Android SDK path is unavailable" >&2; exit 1; }
          sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -perm -111 -print | sort -V | tail -n 1)"
          [[ -x "$sdkmanager_bin" ]] || { echo "sdkmanager was not found under $sdk_root" >&2; exit 1; }
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "build-tools;${BUILD_TOOLS_VERSION}" "platforms;android-30" "platforms;android-35"
          echo "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}" >> "$GITHUB_PATH"

      - name: Install analysis tools
        shell: bash
        run: |
          set -Eeuo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools" payload/out/report

          curl --fail --location --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" \
            -o "$tools/apktool.jar"
          curl --fail --location --retry 3 \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip" \
            -o "$tools/jadx.zip"

          apktool_actual="$(sha256sum "$tools/apktool.jar" | awk '{print $1}')"
          jadx_actual="$(sha256sum "$tools/jadx.zip" | awk '{print $1}')"
          printf 'apktool_%s.jar  %s\njadx-%s.zip  %s\n' \
            "$APKTOOL_VERSION" "$apktool_actual" \
            "$JADX_VERSION" "$jadx_actual" \
            | tee payload/out/report/tool-sha256.txt

          if [[ -n "${APKTOOL_SHA256:-}" ]]; then
            [[ "${APKTOOL_SHA256,,}" == "$apktool_actual" ]] || {
              echo "apktool SHA-256 mismatch" >&2
              exit 1
            }
          fi
          if [[ -n "${JADX_SHA256:-}" ]]; then
            [[ "${JADX_SHA256,,}" == "$jadx_actual" ]] || {
              echo "jadx SHA-256 mismatch" >&2
              exit 1
            }
          fi

          unzip -q "$tools/jadx.zip" -d "$tools/jadx"
          chmod +x "$tools/jadx/bin/jadx"
          echo "APKTOOL_JAR=$tools/apktool.jar" >> "$GITHUB_ENV"
          echo "JADX_BIN=$tools/jadx/bin/jadx" >> "$GITHUB_ENV"

      - name: Reconstruct and verify original APK
        run: scripts/ci/reconstruct.sh "$APK_NAME"
        working-directory: payload

      - name: Decode and locate MediaSession/lyrics paths
        run: scripts/ci/analyze.sh
        working-directory: payload

      - name: Prepare focused patching report
        shell: bash
        working-directory: payload
        run: |
          set -Eeuo pipefail
          report=out/report
          focused=out/focused
          mkdir -p "$focused/files"

          pattern='MediaPlaybackService|MediaSession|MediaMetadata|setMetadata|setExtras|HAS_LYRICS|lyrics|Lyrics|TimedText|Ttml'
          roots=(
            work/jadx/sources/com/apple/android/music
            work/apktool/smali/com/apple/android/music
            work/apktool/smali_classes2/com/apple/android/music
            work/apktool/smali_classes3/com/apple/android/music
            work/apktool/smali_classes4/com/apple/android/music
          )

          existing_roots=()
          for root in "${roots[@]}"; do
            [[ -d "$root" ]] && existing_roots+=("$root")
          done

          : > "$report/focused-paths.txt"
          if ((${#existing_roots[@]} > 0)); then
            grep -RIlE "$pattern" "${existing_roots[@]}" \
              | LC_ALL=C sort -u \
              | head -n 600 \
              > "$report/focused-paths.txt" || true

            grep -RInE -C 16 "$pattern" "${existing_roots[@]}" \
              > "$report/focused-context.txt" || true
          fi

          while IFS= read -r source; do
            [[ -f "$source" ]] || continue
            mkdir -p "$focused/files/$(dirname "$source")"
            cp "$source" "$focused/files/$source"
          done < "$report/focused-paths.txt"

          cp "$report"/*.txt "$focused/" 2>/dev/null || true
          cp "$report"/*.log "$focused/" 2>/dev/null || true
          tar -C "$focused" -czf "$report/focused-sources.tar.gz" files
          rm -rf "$focused/files"
          rm -f "$report/decode-sources.tar.gz"

          find "$report" -maxdepth 1 -type f -printf '%f\t%s bytes\n' \
            | LC_ALL=C sort > "$report/report-files.txt"

      - name: Apply reviewed patches
        if: ${{ inputs.rebuild }}
        run: bash ../cloud-patch/apply.sh
        working-directory: payload

      - name: Rebuild, align and fixed-sign
        if: ${{ inputs.rebuild }}
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: bash ../cloud-patch/rebuild.sh
        working-directory: payload

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-results-${{ github.run_number }}-report
          path: payload/out/report/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0

      - name: Upload verified APK
        if: ${{ inputs.rebuild && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-results-${{ github.run_number }}
          path: |
            payload/out/apple-music-vivo-car-lyrics-debug.apk
            payload/out/apple-music-vivo-car-lyrics-debug.apk.sha256
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
